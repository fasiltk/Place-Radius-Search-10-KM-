<!DOCTYPE html>
<html>
<head>
    <title>Search Nearby Places</title>
</head>
<body>

<h2>Find Places within 10 KM</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <input type="text" name="place_name" placeholder="Enter a place" required>
    <button type="submit">Search</button>
</form>

</body>
</html>
